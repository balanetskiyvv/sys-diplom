---
- name: install and configure zabbix server
  hosts: monitoring
  become: yes
  vars:
    pass_zabbixdb: zabbix

  tasks:
    - name: download zabbix repo
      shell: wget https://repo.zabbix.com/zabbix/6.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_6.0+ubuntu22.04_all.deb
      args:
        chdir: /tmp

    - name: install zabbix repo
      shell: dpkg -i zabbix-release_latest_6.0+ubuntu22.04_all.deb
      args:
        chdir: /tmp

    - name: update packs
      apt:
        update_cache: yes

    - name: install zabbix server
      apt:
        name:
          - apache2
          - python3-pexpect
          - python3-pip
          - python3-dev
          - python3-venv
          - python3-psycopg2
          - zabbix-server-pgsql
          - zabbix-frontend-php
          - php8.1-pgsql
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent
        state: present

    - name: take DBPassword in configure file Zabbix
      lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: '^DBPassword='
        line: 'DBPassword=zabbix'

    - name: restart zabbix server
      service:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - zabbix-server
        - zabbix-agent
        - apache2
